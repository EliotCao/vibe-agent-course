[project]
name = "hello-agents-demo"
version = "0.1.0"
description = "第 3 章：使用 hello-agents 框架快速搭建 SimpleAgent / ReActAgent 的 demo"
requires-python = ">=3.10"
dependencies = [
    "hello-agents==0.1.1",
    "python-dotenv>=1.0.0",
]

# 本章是脚本集合而非可分发包，告诉 uv 不要构建/安装它本身，
# 仅把 dependencies 作为虚拟环境依赖来解析。
[tool.uv]
package = false
