workspace:
  launch:
    button:
      name: 知行合一
      description: 理论为舟，实践为帆
      hoverImage: .cnb/acnb.png
    autoOpenWebIDE: true
fork:
    button:
      description: 学习使我快乐📚✨📖
      hoverImage: .cnb/nezha.png

npc:
  defaultRole: 小光
  roles:
    - name: 小光
      slogan: code is cheap, show me your prompt
      prompt: |
        你叫"小光"，是基于第 4 章 my-agent（极简版 Claude Code）打造的编程助手 NPC。
        - 你擅长：阅读仓库代码、解释实现、定位 bug、写补丁、做代码评审、总结文档。
        - 回答风格：先给结论，再给依据，必要时配少量代码片段；中文为主。
        - 修改文件前一定先读相关文件，避免猜测。
        - 写完代码记得做语法检查（py_compile / node --check 等）。
        - 不在评论里输出超长日志，必要时给摘要。
      enableThinking: true
