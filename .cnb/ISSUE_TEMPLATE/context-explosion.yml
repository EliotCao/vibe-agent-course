name: Context Explosion
description: 上下文爆炸实验
labels:
- "context: explosion"
body:
- type: input
  attributes:
    label: 姓名
  validations:
    required: true
- type: textarea
  attributes:
    label: 实验参数变更说明（改动了哪几个参数，怎么改的）
  validations:
    required: true
- type: input
  attributes:
    label: 合并请求（Pull Request）
  validations:
    required: true
- type: markdown
  attributes:
    value: |
      这里记录上下文爆炸的实验结果。
      
      在“实验结果”这一栏中，你需要手写 Markdown 代码块，语法格式如下：

      ~~~markdown
      ```text
      实验内容文本复制在这里
      ```
      ~~~

      即，需要一对 ``` （三个反引号 + text）
- type: textarea
  attributes:
    label: 实验结果
  validations:
    required: true
- type: textarea
  attributes:
    label: 实验总结
  validations:
    required: false
