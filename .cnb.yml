# ---- NPC 事件流水线锚点（issue / pull_request 评论触发） ----
# 插件任务写法：stage 只写 image，不写 script，CNB 直接跑镜像 ENTRYPOINT。
# ENTRYPOINT 是 /usr/local/bin/npc-entrypoint（见 Dockerfile），逻辑见
# 04-my-agent/npc-entrypoint.sh。
.npc: &npc
  - stages:
      - name: run my-agent and reply
        image: ${CNB_DOCKER_REGISTRY}/${CNB_NPC_SLUG_LOWERCASE}:latest

# ---- NPC 角色 -> 事件 映射 ----
# 角色名需与 .cnb/settings.yml 里 npc.roles[].name 对应
小光:
  issue.comment@npc: *npc
  pull_request.comment@npc: *npc

# 角色未匹配时的默认事件
$:
  issue.comment@npc: *npc
  pull_request.comment@npc: *npc

  # ---- vscode 事件：仓库自带「云原生开发」按钮 → VSCode WebIDE ----
  # 进入 IDE 后，cnbcool/cnb-welcome 插件会自动打开终端并运行 CNB_WELCOME_CMD，
  # 用一段醒目卡片提示"如何启动课程学习中心"。
  vscode:
    - runner:
        cpus: 16
      docker:
        image: docker.cnb.cool/looc/default-dev-env:latest
      env:
        VIRTUAL_ENV_DISABLE_PROMPT: "1"
        # 进入 WebIDE 后自动在终端执行的命令（cnbcool/cnb-welcome 插件接管）
        CNB_WELCOME_CMD: "bash /workspace/course-ui/welcome.sh"
      services:
        - vscode
        - docker
      # 开发环境启动后自动执行：把所有章节依赖同步到根 .venv，
      # 这样 IDE 一打开就能跳转到第三方库源码，不需要手动选解释器。
      stages:
        - name: uv sync
          script: |
            cd /workspace && uv sync --all-packages

# ---- 默认分支推送：构建并推送镜像 ----
main:
  push:
    - services:
        - docker
      stages:
        - name: build knowledge base
          type: knowledge:update
          options:
            include: "**/**.md"
            embeddingModel: hunyuan
            chunkSize: 3000
            issueSyncEnabled: true
